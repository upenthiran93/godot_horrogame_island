<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater · Story Map</title>
<style>
  :root {
    --bg: #0e1113; --panel: #161b1f; --line: #2a3238;
    --text: #d8dee3; --muted: #8a969e; --accent: #7fb3a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 14px 0 0; }
  button { background: #22292e; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.small { padding: 3px 7px; font-size: 12px; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; height: calc(100% - 50px); }
  #editor { overflow: auto; border-right: 1px solid var(--line); padding: 12px; }
  #map { overflow: auto; padding: 16px; }
  #map svg { max-width: none !important; }
  .chapter { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 14px; }
  .chapter h2 { font-size: 15px; margin: 0; flex: 1; }
  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin: 8px 0 3px; }
  input, textarea { width: 100%; background: #0b0e10; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  textarea { min-height: 48px; resize: vertical; }
  .beat { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 5px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > input { flex: 1; min-width: 0; }
  .num { width: 26px; color: var(--muted); text-align: right; flex: none; }
  .muted { color: var(--muted); font-size: 12px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; height: auto; }
    #editor { border-right: none; border-bottom: 1px solid var(--line); }
    #map { min-height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Tidewater · Story Map</h1>
  <button id="addChapter">+ Chapter</button>
  <button id="download">Download JSON</button>
  <button id="import">Import JSON</button>
  <input type="file" id="file" accept="application/json" hidden>
  <button id="reset">Discard browser edits</button>
  <span id="status"></span>
</header>
<main>
  <section id="editor"></section>
  <section id="map"><p class="muted">Drawing chart…</p></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>
<script>
// ---- Seed data: taken from godot/story/chapters/*.md (Markdown stays the reference) ----
const SEED = {
  chapters: [
    {
      title: "The Old Harbor",
      summary: "Dropped on the beach by a captain who fears the Black Stone (the Sleeper's spire), the player crosses a collapsing ravine scaffold to the Old Harbor. They find Cpl. Reyes's body on the watchtower, Vane switches on the searchlight via the grid, and they cut the gate chain as the Black Stone rises.",
      beats: [
        { title: "Title and chapter card", time: "0:00", area: "", note: "Black screen" },
        { title: "The crossing: captain's warning", time: "0:10", area: "Beach (A01)", note: "7 lines; the Black Stone offshore" },
        { title: "The boat leaves", time: "1:01", area: "Beach (A01)", note: "Locked-off; the boat lamp shrinks" },
        { title: "Ashore: fallen tree, ruined wall", time: "1:10", area: "Trail (A02)", note: "Crouch under the tree, then climb the wall" },
        { title: "The three-hollow shrine", time: "1:39", area: "Trail (A02)", note: "Elias's scratched warning; Mara's faint harmonic whisper" },
        { title: "The scaffold", time: "1:55", area: "Ravine (A03)", note: "Creaks louder each time" },
        { title: "The collapse", time: "2:19", area: "Ravine (A03)", note: "Point of no return" },
        { title: "The harbor and the chained gate", time: "2:28", area: "Old Harbor (A04)", note: "Detachment 9 insignia (Vane Bio-Marine front)" },
        { title: "The shed: sign-out sheet", time: "2:58", area: "Old Harbor (A04)", note: "Reyes never came down. Door slams, wet footfalls on roof, door opens" },
        { title: "The watchtower: Reyes's body", time: "3:36", area: "Old Harbor (A04)", note: "Bolt cutters; torn fingernails and seawater on dry planks" },
        { title: "The searchlight", time: "4:17", area: "Old Harbor (A04)", note: "Vane switches it on via the grid: The Shepherd in the yard" },
        { title: "Run for the gate & cut the chain", time: "4:31", area: "Old Harbor (A04)", note: "Gate opens; sub-bass horn rumble as the Black Stone rises higher" }
      ]
    },
    {
      title: "Base Camp",
      summary: "The camp is Vane Bio-Marine's supply depot for the Upper Crater Array. Hide from The Shepherd in the barracks, power the substation, hear Vane's spliced 'Elias' voice on the intercom, and escape in Car 2.",
      beats: [
        { title: "Aerial: camp and cable line", time: "0:00", area: "Base Camp (A05)", note: "Cable line rising into luminescent mountain fog" },
        { title: "Supply yard: Project TIDEWATER manifest", time: "0:19", area: "Base Camp (A05)", note: "Crates stamped UPPER CRATER ARRAY" },
        { title: "Cable car station: dead drive", time: "0:42", area: "Base Camp (A05)", note: "Runs off Substation B" },
        { title: "Barracks: Elias's locker & fuel can", time: "1:04", area: "Base Camp (A05)", note: "Photo of Elias & Dr. Mara Chen; draft letter warning not to trust his phone" },
        { title: "Encounter 1: hide in locker", time: "1:58", area: "Base Camp (A05)", note: "The Shepherd enters dripping brine, mimicking Reyes's voice" },
        { title: "Fuel generator & throw breakers", time: "2:28", area: "Base Camp (A05)", note: "Order: Lighting -> Comms -> Main" },
        { title: "Intercom: Vane's spliced 'Elias' message", time: "3:35", area: "Base Camp (A05)", note: "Lures player up the mountain: \"It's climbing the line\"" },
        { title: "Board Car 2, throw RUN", time: "4:12", area: "Base Camp (A05)", note: "Car lurches out as The Shepherd slams the platform rail" }
      ]
    },
    {
      title: "The Line",
      summary: "Car 2 climbs into luminescent fog while The Shepherd races the slope. Elias's sabotage stops the car at Pylon 3; climbing down the ladder, a rung snaps and drops the player into the Old Village hollow.",
      beats: [
        { title: "Ride up over the camp", time: "0:04", area: "Ropeway (A06)", note: "Jolt over the first tower saddle" },
        { title: "Something on the slope", time: "0:24", area: "Ropeway (A06)", note: "The Shepherd keeps pace with the car" },
        { title: "It's ahead", time: "0:48", area: "Ropeway (A06)", note: "The Shepherd waits by the next tower" },
        { title: "The breakdown at Pylon 3", time: "1:02", area: "Ropeway (A06)", note: "Elias's clamp sabotage stops Car 2 dead; cabin light dies" },
        { title: "Climbing out & The Fall", time: "1:24", area: "Ropeway (A06)", note: "Rung snaps on Pylon 3 ladder; fall into the sunken village hollow" }
      ]
    },
    {
      title: "The Old Village",
      summary: "In the unpowered village ruins, uncover the Sleeper's Cosmic Law and Capt. Locke's 1784 massacre. Survive Vane's false lift code (7392), claim the Pale Shard in the Burned Quarter, and ride the lift to the Service Path—where The Shepherd smashes the plank bridge.",
      beats: [
        { title: "Waking in the hollow (Dead Zone)", time: "0:04", area: "Hollow Edge (A08)", note: "No electricity reaches here; Vane is blind" },
        { title: "Year marks & The Healing Wall", time: "1:00", area: "Village Lanes (A09)", note: "Carvings of the Sleeper, Pale Shards, and the Deep Chorus" },
        { title: "The Guest House: 1784 Ship's Log", time: "1:33", area: "Village Lanes (A09)", note: "Capt. Alistair Locke (HMS Madrigal) plots to steal the Three Tide-Stones" },
        { title: "The figure in the window", time: "2:09", area: "Village Lanes (A09)", note: "First glimpse of The Shepherd in his 1784 naval coat" },
        { title: "Festival Ring & Vane's dig site", time: "2:23", area: "Festival Ring (A10)", note: "Three empty stone sockets dug up by Detachment 9" },
        { title: "Start the generator & Vane's false code", time: "3:11", area: "Festival Ring (A10)", note: "Loud generator wakes the dig radio; Vane gives false code 7392 (alarm!)" },
        { title: "Burned Quarter & The Pale Shard", time: "4:35", area: "Burned Quarter (A11)", note: " Acquire the Pale Shard from villager skeleton; guard's keycard & flare" },
        { title: "The Last Carving & Stalking", time: "5:45", area: "Burned Quarter (A11)", note: "Carving reveals Capt. Locke is The Shepherd; sneak back to the ring" },
        { title: "Real code (2604) & Cargo Lift", time: "6:43", area: "Festival Ring (A10)", note: "Find Elias's real code in dig log; ride lift up to Service Path" },
        { title: "Lit Service Path & Bridge Ambush", time: "8:17", area: "Service Path (A07)", note: "Vane's voice glitches on the path; Shepherd smashes stream bridge into West Gully" }
      ]
    },
    {
      title: "The Belly of the Mountain",
      summary: "Plunged to sea level beside the risen Black Stone, traverse the 1784 wreck of the HMS Madrigal, the calcified crew in the Sea Cave, and the 170m Abyssal Caverns of the Deep Chorus to find the dying Sgt. Elias and Tide-Stone #3 in Bunker B.",
      beats: [
        { title: "West Gully & Black Stone Vista", time: "0:00", area: "West Gully (A12)", note: "Slide down to West Cove (1m elev); the Black Stone vibrates the tide" },
        { title: "Boarding the HMS Madrigal (1784)", time: "3:00", area: "Shipwreck (A13)", note: "Tidal gun-deck puzzle: move between air pockets between swells" },
        { title: "Melted Iron Cage & Elias's Pack", time: "7:00", area: "Shipwreck (A13)", note: "Where Locke tried to chain the god; Elias's note points to Bunker B" },
        { title: "The Sea Cave: Calcified 1784 Crew", time: "9:00", area: "Sea Cave (A14)", note: "Locke's mutineers fused like living white coral into the walls" },
        { title: "Smuggler's Tunnel & Totem Flash", time: "13:00", area: "Tunnel (A15)", note: "Hide in submerged water alcoves; use Pale Shard at totem to blind Shepherd" },
        { title: "Abyssal Caverns: The Deep Chorus", time: "19:00", area: "Caverns (A16-A18)", note: "170m climb past petrified villagers; the Sleeper's cathedral Eye in the chasm below" },
        { title: "Three Harmonic Chime Bridges", time: "24:00", area: "Caverns (A18)", note: "Guided by Mara's Echo through the Pale Shard to reach 200m" },
        { title: "Sub-Level Bunker B: Finding Elias", time: "27:00", area: "Bunker B (A19)", note: "Real Elias dies after giving you Tide-Stone #3; Vane drops his disguise on PA; ride 75m lift" }
      ]
    },
    {
      title: "The Siphon & The Summit",
      summary: "Survive Vane's automated building traps in the Research Center, confront Vane's mutating body inside the Neural Siphon Facility, and face The Shepherd at the Summit Crater Circle for the 3 Cosmic Horror Endings.",
      beats: [
        { title: "Upper Station & Halon Trap", time: "0:00", area: "Research Center (A20)", note: "Shepherd climbed Car 1's line; Vane locks doors and vents halon gas" },
        { title: "Dr. Mara Chen's Acoustics Lab", time: "4:00", area: "Research Center (A20)", note: "Mara's final tape explains the Cosmic Law and unlocks Ending 3" },
        { title: "Server Room Fuse Blackout", time: "7:00", area: "Control Room (A21)", note: "Pull 3 manual bus-fuses to blind Vane while evading The Shepherd in the dark" },
        { title: "The Neural Siphon Facility: Vane's Body", time: "12:00", area: "Siphon Lab (A22)", note: "Confront Vane's half-calcified, barnacle-fused body in the Faraday Pod" },
        { title: "The Siphon Routing Console", time: "16:00", area: "Siphon Lab (A22)", note: "Choose: Leave Active, Overload Pod, or Sever Conduit Cables" },
        { title: "The Summit Crater & Void Halo", time: "18:00", area: "Summit (A23)", note: "430m crater beneath a floating ring of abyssal water; Shepherd's final stand" },
        { title: "The Three Cosmic Horror Endings", time: "22:00", area: "Summit (A23)", note: "1: The Severed Cord (Smash Stone) · 2: The New Shepherd (Obey Vane) · 3: Willing Communion" }
      ]
    }
  ]
};

// ---- State: browser copy if present, otherwise the seed ----
const KEY = "tidewater-story-map-v2";
let state = null;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* storage blocked: fall through */ }
if (!state || !Array.isArray(state.chapters)) state = structuredClone(SEED);

const $ = (id) => document.getElementById(id);
const editor = $("editor"), mapEl = $("map"), statusEl = $("status");

const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const mm = (s) => String(s ?? "").replace(/&/g, "#amp;").replace(/"/g, "#quot;").replace(/</g, "#lt;").replace(/>/g, "#gt;");
const pad = (n) => String(n).padStart(2, "0");

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  const beats = state.chapters.reduce((n, c) => n + c.beats.length, 0);
  statusEl.textContent = `${state.chapters.length} chapters · ${beats} beats · edits kept in this browser (download JSON to keep a copy)`;
}

// ---- Editor panel ----
function renderEditor() {
  editor.innerHTML = state.chapters.map((ch, ci) => `
    <div class="chapter">
      <div class="row">
        <h2>Ch ${pad(ci + 1)}</h2>
        <button class="small" data-act="del-chapter" data-c="${ci}">Delete chapter</button>
      </div>
      <label>Title</label>
      <input value="${esc(ch.title)}" data-c="${ci}" data-f="title">
      <label>Summary</label>
      <textarea data-c="${ci}" data-f="summary">${esc(ch.summary)}</textarea>
      ${ch.beats.map((b, bi) => `
        <div class="beat">
          <div class="row">
            <span class="num">${bi + 1}</span>
            <input value="${esc(b.title)}" placeholder="Beat title" data-c="${ci}" data-b="${bi}" data-f="title">
            <input value="${esc(b.time)}" placeholder="0:00" style="max-width:72px" data-c="${ci}" data-b="${bi}" data-f="time">
          </div>
          <div class="row">
            <span class="num"></span>
            <input value="${esc(b.area)}" placeholder="Area" data-c="${ci}" data-b="${bi}" data-f="area">
            <button class="small" data-act="up" data-c="${ci}" data-b="${bi}" title="Move up">↑</button>
            <button class="small" data-act="down" data-c="${ci}" data-b="${bi}" title="Move down">↓</button>
            <button class="small" data-act="del-beat" data-c="${ci}" data-b="${bi}" title="Delete beat">✕</button>
          </div>
          <textarea placeholder="Notes: camera, sound, mood, PROPOSED…" data-c="${ci}" data-b="${bi}" data-f="note">${esc(b.note)}</textarea>
        </div>`).join("")}
      <div style="margin-top:8px"><button class="small" data-act="add-beat" data-c="${ci}">+ Beat</button></div>
    </div>`).join("");
}

editor.addEventListener("input", (e) => {
  const t = e.target, { c, b, f } = t.dataset;
  if (c === undefined || !f) return;
  const ch = state.chapters[+c];
  if (b === undefined) ch[f] = t.value; else ch.beats[+b][f] = t.value;
  scheduleRender();
  save();
});

editor.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const { act, c, b } = btn.dataset;
  const ch = state.chapters[+c];
  const bi = +b, beats = ch.beats;
  if (act === "add-beat") beats.push({ title: "New beat", time: "", area: "", note: "" });
  if (act === "del-beat") beats.splice(bi, 1);
  if (act === "up" && bi > 0) [beats[bi - 1], beats[bi]] = [beats[bi], beats[bi - 1]];
  if (act === "down" && bi < beats.length - 1) [beats[bi], beats[bi + 1]] = [beats[bi + 1], beats[bi]];
  if (act === "del-chapter" && confirm(`Delete chapter "${ch.title}" and its beats?`)) state.chapters.splice(+c, 1);
  renderEditor(); scheduleRender(); save();
});

// ---- Flowchart (Mermaid) ----
function beatLabel(b) {
  const meta = [b.time, b.area].filter(Boolean).join(" · ");
  return `<b>${mm(b.title)}</b>${meta ? "<br/>" + mm(meta) : ""}`;
}

function buildGraph() {
  const lines = ["flowchart TD"];
  let prevEnd = null;
  state.chapters.forEach((ch, ci) => {
    const cid = "c" + ci;
    lines.push(`subgraph ${cid}["${mm(`Ch ${pad(ci + 1)} · ${ch.title}`)}"]`);
    let first = null, prev = null;
    if (!ch.beats.length) {
      first = prev = cid + "_empty";
      lines.push(`${first}["${mm("(no beats yet)")}"]`);
    }
    ch.beats.forEach((b, bi) => {
      const id = `${cid}_b${bi}`;
      lines.push(`${id}["${beatLabel(b)}"]`);
      if (prev) lines.push(`${prev} --> ${id}`);
      if (!first) first = id;
      prev = id;
    });
    lines.push("end");
    if (prevEnd && first) lines.push(`${prevEnd} ==> ${first}`);
    if (prev) prevEnd = prev;
  });
  const next = `Ch ${pad(state.chapters.length + 1)} · not designed yet`;
  if (prevEnd) lines.push(`${prevEnd} -.-> next(["${mm(next)}"])`);
  else lines.push(`next(["${mm(next)}"])`);
  lines.push("classDef todo stroke-dasharray:5 5,fill:none,color:#8a969e");
  lines.push("class next todo");
  return lines.join("\n");
}

let renderTimer = null, renderCount = 0;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); }

async function render() {
  if (typeof mermaid === "undefined") {
    mapEl.innerHTML = '<p class="muted">The chart library did not load (it comes from a CDN, so an internet connection is needed). The editor still works.</p>';
    return;
  }
  try {
    const { svg } = await mermaid.render("story" + (++renderCount), buildGraph());
    mapEl.innerHTML = svg;
  } catch (err) {
    mapEl.innerHTML = `<pre class="muted">Could not draw the chart:\n${esc(err.message || err)}</pre>`;
  }
}

if (typeof mermaid !== "undefined") {
  mermaid.initialize({ startOnLoad: false, theme: "dark", flowchart: { useMaxWidth: false, curve: "basis", htmlLabels: true } });
}

// ---- Header buttons ----
$("addChapter").onclick = () => {
  state.chapters.push({ title: "New chapter", summary: "", beats: [] });
  renderEditor(); scheduleRender(); save();
};

$("download").onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "tidewater_story.json" });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

$("import").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.chapters)) throw new Error("no 'chapters' list in this file");
    state = data;
    renderEditor(); scheduleRender(); save();
  } catch (err) {
    alert("Could not import: " + err.message);
  }
  e.target.value = "";
};

$("reset").onclick = () => {
  if (!confirm("Discard the edits saved in this browser and go back to the story files?")) return;
  try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  state = structuredClone(SEED);
  renderEditor(); scheduleRender(); save();
};

// ---- Start ----
renderEditor();
save();
render();
</script>
</body>
</html>
